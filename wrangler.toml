# Cloudflare Worker config for HexaFalls.
#
# Worker name : `hexafalls`
# Workers URL : https://hexafalls.<account-subdomain>.workers.dev
#
# Deploy: `npm run deploy` locally, or push to `main` (prod) / `preview` (preview)
#         to trigger the GitHub Actions deploy workflow.
#
# Custom domains:
#   main    branch → hexafalls.org + www.hexafalls.org   (top-level routes below)
#   preview branch → preview.hexafalls.org               (env.preview routes)
#
# Docs: https://developers.cloudflare.com/workers/configuration/routing/custom-domains/

name                 = "hexafalls"
main                 = ".open-next/worker.js"
compatibility_date   = "2026-04-01"
compatibility_flags  = ["nodejs_compat", "global_fetch_strictly_public"]

# Keep the workers.dev preview URL live alongside the custom domain.
workers_dev = true

# Static assets emitted by @opennextjs/cloudflare
[assets]
binding   = "ASSETS"
directory = ".open-next/assets"

[observability]
enabled            = true
head_sampling_rate = 1

# Bind hexafalls.org (apex + www) to this Worker on every prod deploy.
# Zone must be on the same Cloudflare account.
[[routes]]
pattern        = "hexafalls.org"
custom_domain  = true

[[routes]]
pattern        = "www.hexafalls.org"
custom_domain  = true

# ---------------------------------------------------------------------------
# Preview environment — pushed by CI on the `preview` branch.
# Lives at hexafalls-preview.<account>.workers.dev AND preview.hexafalls.org
# ---------------------------------------------------------------------------

[env.preview]
name        = "hexafalls-preview"
workers_dev = true

[env.preview.observability]
enabled            = true
head_sampling_rate = 1

[[env.preview.routes]]
pattern        = "preview.hexafalls.org"
custom_domain  = true

# ---------------------------------------------------------------------------
# Registration DB — Cloudflare D1.
#
# Create the DB once:
#   wrangler d1 create hexafalls
#   → copy the `database_id` it prints below.
#
# Apply migrations:
#   wrangler d1 execute hexafalls --local  --file=worker/migrations/0001_init.sql
#   wrangler d1 execute hexafalls --remote --file=worker/migrations/0001_init.sql
#
# Secrets (set per-environment with `wrangler secret put NAME [--env preview]`):
#   ELIXPO_CLIENT_ID
#   ELIXPO_CLIENT_SECRET
#   SESSION_SECRET           -- 32+ random bytes, base64 or hex
# ---------------------------------------------------------------------------
[[d1_databases]]
binding       = "DB"
database_name = "hexafalls"
database_id   = ""               # ← paste the id from `wrangler d1 create`
migrations_dir = "worker/migrations"

[[env.preview.d1_databases]]
binding       = "DB"
database_name = "hexafalls-preview"
database_id   = ""
migrations_dir = "worker/migrations"

# Non-secret config — secrets go via `wrangler secret put`.
[vars]
ELIXPO_REDIRECT_URI = "https://hexafalls.org/api/auth/callback"
ELIXPO_AUTHORIZE_URL = "https://accounts.elixpo.com/oauth/authorize"
ELIXPO_TOKEN_URL    = "https://accounts.elixpo.com/api/auth/token"
ELIXPO_USERINFO_URL = "https://accounts.elixpo.com/api/auth/me"

[env.preview.vars]
ELIXPO_REDIRECT_URI = "https://preview.hexafalls.org/api/auth/callback"
ELIXPO_AUTHORIZE_URL = "https://accounts.elixpo.com/oauth/authorize"
ELIXPO_TOKEN_URL    = "https://accounts.elixpo.com/api/auth/token"
ELIXPO_USERINFO_URL = "https://accounts.elixpo.com/api/auth/me"
