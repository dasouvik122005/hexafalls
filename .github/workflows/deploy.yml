name: Deploy

on:
  push:
    branches: [main, preview]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.surface.outputs.deployment-url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build via OpenNext
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare (Production)
        if: github.ref == 'refs/heads/main'
        run: npx wrangler deploy

      - name: Deploy to Cloudflare (Preview)
        if: github.ref == 'refs/heads/preview'
        run: npx wrangler deploy --env preview

      - name: Surface URL
        id: surface
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "deployment-url=https://hexafalls.org" >> "$GITHUB_OUTPUT"
          else
            echo "deployment-url=https://preview.hexafalls.org" >> "$GITHUB_OUTPUT"
          fi
