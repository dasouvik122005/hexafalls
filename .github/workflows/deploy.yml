name: Deploy

on:
  push:
    branches: [main, preview]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read           # writes go through the GitHub App token, not GITHUB_TOKEN
      deployments: write
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url:  ${{ steps.surface.outputs.deployment-url }}
    env:
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Mint a short-lived installation token from the elixpo_github_bot App.
      # That token authenticates the version-bump push so the commit's
      # author/committer (elixpoo@gmail.com, set below) is reflected on GitHub.
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id:      ${{ secrets.ELIXPO_GITHUB_APP_ID }}
          private-key: ${{ secrets.ELIXPO_GITHUB_PRIVATE_KEY }}

      - name: Verify Cloudflare secrets are present
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ];  then echo "::error::CLOUDFLARE_API_TOKEN repo secret is missing.";  exit 1; fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID repo secret is missing."; exit 1; fi

      - name: Install
        run: npm ci

      - name: Build via OpenNext
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare (Production)
        if: github.ref == 'refs/heads/main'
        run: npx wrangler deploy --env=""

      - name: Deploy to Cloudflare (Preview)
        if: github.ref == 'refs/heads/preview'
        run: npx wrangler deploy --env preview

      - name: Surface URL
        id: surface
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "deployment-url=https://hexafalls.org" >> "$GITHUB_OUTPUT"
          else
            echo "deployment-url=https://preview.hexafalls.org" >> "$GITHUB_OUTPUT"
          fi

      # After a successful production deploy, bump the patch version.
      # Pushed via the App token, but author + committer are set to the human
      # so GitHub displays the commit with elixpoo's avatar / profile link.
      - name: Bump patch version (production only)
        if: github.ref == 'refs/heads/main' && success()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name  "elixpoo"
          git config user.email "elixpoo@gmail.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git pull --rebase --autostash origin main
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          git commit -m "chore(release): v${NEW_VERSION} [skip ci]"
          git push origin HEAD:main
