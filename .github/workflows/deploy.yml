name: Deploy

on:
  push:
    branches: [main, preview]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      deployments: write
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.surface.outputs.deployment-url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Cloudflare secrets are wired
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. Check the secret on the '${{ job.environment.name || 'production' }}' GitHub Environment (or at repo level)."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is empty. Same check applies."
            exit 1
          fi
          echo "secrets present (token len=${#CLOUDFLARE_API_TOKEN}, account len=${#CLOUDFLARE_ACCOUNT_ID})"

      - name: Install
        run: npm ci

      - name: Build via OpenNext
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare (Production)
        if: github.ref == 'refs/heads/main'
        run: npx wrangler deploy --env=""

      - name: Deploy to Cloudflare (Preview)
        if: github.ref == 'refs/heads/preview'
        run: npx wrangler deploy --env preview

      - name: Surface URL
        id: surface
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "deployment-url=https://hexafalls.org" >> "$GITHUB_OUTPUT"
          else
            echo "deployment-url=https://preview.hexafalls.org" >> "$GITHUB_OUTPUT"
          fi

      # After a successful production deploy, advance the patch version so the
      # repo always reflects "what will ship on the next prod deploy".
      # `[skip ci]` in the commit message tells Actions not to retrigger.
      - name: Bump patch version (production only)
        if: github.ref == 'refs/heads/main' && success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          git commit -m "chore(release): v${NEW_VERSION} [skip ci]"
          git push origin HEAD:main
