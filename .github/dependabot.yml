version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    target-branch: preview
    labels: [dependencies]
    groups:
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      cloudflare:
        patterns:
          - "@opennextjs/*"
          - "wrangler"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      types:
        patterns:
          - "@types/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    target-branch: preview
    labels: [github-actions]
